services:
  viewer:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    command: ["python", "-u", "/app/.base44/viewer.py"]
    ports: ["3000:3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:3000/',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
