services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./site:/app
      - node_modules:/app/node_modules
      - appdata:/data
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DB_PATH=/data/app.db
      - PORT=3000
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    ports: ["3000:3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
volumes:
  node_modules:
  appdata:
